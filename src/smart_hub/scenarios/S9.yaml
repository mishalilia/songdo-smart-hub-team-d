# S9 — negative tests, degraded operation, emergency stop (assignment 16.3). Owner: M9
# The robot is moving from t = 2 s; stop asserted at 10 s, released input at 12 s,
# reset rejected while a sensor is stale, accepted after sensors are restored.
scenario_id: S9
duration_sec: 40
events:
  - {t: 2.0,  type: escort_request, request_id: s9-escort, pickup: R, destination: D}
  - {t: 4.0,  type: confirm_ready}
  - {t: 10.0, type: estop, value: true}
  - {t: 12.0, type: estop, value: false}          # latch must hold
  - {t: 13.0, type: freeze_odometry}              # stale critical sensor
  - {t: 14.0, type: clear_stop_request}           # must be rejected
  - {t: 20.0, type: restore_sensors}
  - {t: 22.0, type: clear_stop_request}           # accepted; robot stays stopped
expected:
  stop_latency_sec: 0.20
