# Author: Vadim Lifrov (12240192)
# S3 — bus arrival and docking (assignment 10.3).
# Nominal docking: bus starts at A, four passengers wait, DockBus goal at 2 s.
# Test variants (assignment 10.3): launch with variant:=<name>.
scenario_id: S3
duration_sec: 120
bus: {start_node: A}
events:
  - {t: 1.0,  type: clear_stop_request}            # startup latch -> ready (16.3)
  - {t: 0.0, type: spawn_queue_tracks, count: 4}
  - {t: 2.0, type: dock_request, bus_id: bus1, bay_id: B, max_duration_sec: 240.0}
expected:
  position_error_m: 0.20
  cancel_to_zero_cmd_sec: 0.5
variants:
  pedestrian_before_entry:
    - {t: 8.0,  type: crossing_pedestrian, duration_sec: 6.0}
  blocked_bay:
    - {t: 2.0,  type: place_obstacle, id: bay_block, center: [8.0, 4.0], radius: 0.35}
    - {t: 40.0, type: remove_obstacle, id: bay_block}
  cancel_during_approach:
    - {t: 10.0, type: cancel_goal, target: dock}
  stale_bus_pose:
    - {t: 10.0, type: freeze_vehicle_source, vehicle: bus1}
