# S7 — autonomous robot passenger escort (assignment 14.3). Owner: M7
# Nominal escort R -> D with obstacle O inserted during ESCORT. Other runs: no readiness,
# obstacle before crossing, cancel while moving, second goal while busy, unreachable
# destination, odometry freeze — enable the commented events one at a time.
scenario_id: S7
duration_sec: 240
robot: {start_node: R}
events:
  - {t: 1.0,  type: clear_stop_request}            # startup latch -> ready (16.3)
  - {t: 2.0,  type: escort_request, request_id: demo-01, passenger_id: P01,
     pickup: R, destination: D, max_duration_sec: 240.0}
  - {t: 6.0,  type: confirm_ready}
  - {t: 30.0, type: place_obstacle, id: O, center: [7.0, 2.0], radius: 0.35}
  # - {t: 40.0, type: cancel_goal, target: escort}                          # cancel while moving
  # - {t: 10.0, type: escort_request, request_id: demo-02, pickup: R, destination: D}  # busy
  # - {t: 20.0, type: freeze_odometry, duration_sec: 3.0}                   # odometry freeze
expected:
  destination_error_m: 0.20
  feedback_min_hz: 2.0
