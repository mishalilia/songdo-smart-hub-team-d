# Common map M1 (assignment sections 2-3).
# Origin south-west corner, +x east, +y north, metres / radians. Frame: map.
frame_id: map
bounds: {xmin: 0.0, xmax: 12.0, ymin: 0.0, ymax: 8.0}

nodes:
  A: [1.0, 2.0]
  Cs: [5.0, 2.0]
  J: [9.0, 2.0]
  E: [11.0, 2.0]
  N: [1.0, 4.0]
  Cn: [5.0, 4.0]
  B: [8.0, 4.0]
  U: [11.0, 4.0]
  R: [3.0, 6.0]
  W: [5.0, 6.0]
  D: [9.0, 1.0]
  P1: [8.0, 6.5]
  P2: [9.5, 6.5]
  P3: [11.0, 6.5]

# Undirected; edge length = Euclidean endpoint distance.
vehicle_edges: [[A, Cs], [Cs, J], [J, E], [A, N], [N, Cn], [Cn, B], [B, U], [U, E]]
parking_edges: [[U, P3], [P3, P2], [P2, P1]]     # car-only
robot_edges: [[R, W], [W, Cn], [Cn, Cs], [Cs, J], [J, D],
              [Cn, B], [B, U], [U, E], [E, J]]  # last four: robot detours

regions:
  crossing_C: {xmin: 4.5, xmax: 5.5, ymin: 1.25, ymax: 4.75}
  queue_Q: {xmin: 2.0, xmax: 6.0, ymin: 5.0, ymax: 7.0}

obstacle_O: {center: [7.0, 2.0], radius: 0.35}

bus_bay: B
parking_slots: [P1, P2, P3]
